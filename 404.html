      .not-found p { margin: 0 auto 28px; max-width: 560px; color: rgba(255,255,255,.72); font-size: 18px; }
      .not-found__actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

  </head>
  <body>
    <main class="not-found">
      <section class="not-found__card" aria-labelledby="not-found-title">
        <p class="not-found__code" aria-hidden="true">404</p>

        <div class="not-found__actions">
          <a class="button primary" href="/">Return Home</a>

      </section>
